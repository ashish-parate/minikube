apiVersion: v1
kind: Pod
metadata:
  name: mariadb-pod
  labels:
    app: mariadb-pod
spec:
  containers:
    - name: mariadb
      image: mariadb:latest
      ports:
        - name: mysql
          containerPort: 3306
          protocol: TCP
      env:
        #- name: MYSQL_ROOT_PASSWORD
         # valueFrom:
          #  configMapKeyRef:
           #   name: mysql-cm
            #  key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: mysql-cm
              key: MYSQL_HOST
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-cred
              key: MYSQL_PASSWORD   
          
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: my-cred
              key: MYSQL_USER