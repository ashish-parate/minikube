apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: my-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: my-app
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: nginx:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

        - name: backend
          image: tomcat:latest
          ports:
            - name: java
              containerPort: 8080
              protocol: TCP