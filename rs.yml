apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-rc
  labels:
    app: my-app
    namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
     app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: nginx:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

        - name: backend
          image: tomcat:latest
          ports:
            - name: java
              containerPort: 8080
              protocol: TCP
 