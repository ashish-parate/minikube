apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: my-ds
  labels:
    app: my-app
spec:
  template:
    metadata:
      namespace: ops
      name: my-app
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: nginx:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP